services:
  - type: web
    name: obesity-dashboard
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:10000 Dashboard.dashboard_obesidade_interativo:server"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
